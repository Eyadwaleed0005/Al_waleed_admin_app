name: Development Firebase Distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    name: Build and distribute admin APK
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install Fastlane dependencies
        working-directory: android
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare Firebase credentials
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Distribute APK to the team
        working-directory: android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: bundle exec fastlane android firebase_distribution

      - name: Clean up credentials
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/upload-keystore.jks"
          rm -f "$RUNNER_TEMP/firebase-service-account.json"